# Local infrastructure (default) + the application itself (profile "app").
#   npm run infra:up / infra:down   -> MongoDB, Redis, Kafka, Qdrant only (dev + tests)
#   npm run app:up   / app:down     -> also API, 2 workers, analytics consumer in containers
#
#   npm run infra:up     # start + wait until healthy
#   npm run infra:down   # stop (volumes are kept)

name: workflow-engine

services:
  mongo:
    image: mongo:7
    container_name: wf_mongo
    # Single-node REPLICA SET, not a standalone server. MongoDB only supports
    # multi-document transactions (needed later for the transactional outbox)
    # and change streams on a replica set.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # First run: rs.status() throws because the set isn't initiated yet, so
      # we initiate it. The check only passes once this node is PRIMARY
      # (i.e. actually accepts writes).
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }; if (!db.hello().isWritablePrimary) quit(1)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: wf_redis
    # appendonly: persist writes to disk so a Redis restart doesn't lose queues.
    # noeviction: when memory is full, REJECT writes instead of silently
    #   deleting keys. Evicting a queue entry would lose a task.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: wf_kafka
    # Single-node KRaft (no ZooKeeper). Two listeners:
    #   INTERNAL kafka:19092  for other containers (Phase 26)
    #   EXTERNAL localhost:9095 for processes on the host (dev, tests)
    ports:
      - "9095:9095"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9095,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "wf-kraft-cluster-000001"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9095 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: wf_qdrant
    # Vector database for RAG (Phase 18). REST API on 6333.
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------------------
  # APPLICATION (profile "app"):  npm run app:up   /   npm run app:down
  # Same image for all three; secrets come from the host's .env (--env-file),
  # never baked into the image. Service names replace localhost.
  # ---------------------------------------------------------------------------
  api:
    profiles: ["app"]
    build: { context: .., dockerfile: Dockerfile }
    image: workflow-engine:local
    command: ["node", "src/server.js"]
    ports:
      - "4000:4000"
    environment: &app-env
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: "4000"
      MONGO_URI: mongodb://mongo:27017/workflow_engine?directConnection=true
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:19092
      QDRANT_URL: http://qdrant:6333
      # Ollama runs on the host (GPU/Metal access); containers reach it here.
      LLM_BASE_URL: http://host.docker.internal:11434
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      TRUST_PROXY: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: &app-deps
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/ready > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    profiles: ["app"]
    image: workflow-engine:local
    command: ["node", "src/worker.js"]
    environment: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      <<: *app-deps
      api: { condition: service_healthy } # api's build produces the shared image
    # Horizontal scaling: more replicas, no code change (docker compose up --scale worker=5).
    deploy:
      replicas: 2
    # Give in-flight tasks time to finish on `docker compose stop` (SIGTERM -> drain).
    stop_grace_period: 30s
    restart: unless-stopped

  analytics-consumer:
    profiles: ["app"]
    image: workflow-engine:local
    command: ["node", "src/consumers/analytics.js"]
    environment: *app-env
    depends_on:
      <<: *app-deps
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
  qdrant_data:
